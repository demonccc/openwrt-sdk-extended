name: Validate SDK profiles
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate profile schema and matrix
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML
          python3 scripts/profiles.py validate
          python3 scripts/profiles.py matrix > /tmp/sdk-profiles-matrix.json
          python3 -m json.tool /tmp/sdk-profiles-matrix.json > /dev/null
