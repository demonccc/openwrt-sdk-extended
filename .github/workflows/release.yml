name: Build and release SDK extension
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile path under profiles/ (for example 25.12.6/mips_24kc)
        required: true
        type: string
        default: 25.12.6/mips_24kc
      target:
        description: Official OpenWrt target (for example ath79)
        required: true
        type: string
        default: ath79
      subtarget:
        description: Official OpenWrt subtarget (for example generic)
        required: true
        type: string
        default: generic
      component:
        description: Development component to prepare
        required: true
        type: choice
        options: [rust, glib, dbus, openssl]
      publish:
        description: Publish a GitHub Release after successful preparation
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sdk-ext-${{ inputs.profile }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ inputs.component }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: demonccc/openwrt-builder:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install profile reader
        run: python3 -m pip install --break-system-packages --disable-pip-version-check PyYAML
      - name: Validate profiles
        run: python3 scripts/profiles.py validate
      - name: Prepare component and package delta
        env:
          PROFILE: ${{ inputs.profile }}
          TARGET: ${{ inputs.target }}
          SUBTARGET: ${{ inputs.subtarget }}
          COMPONENT: ${{ inputs.component }}
        run: |
          python3 scripts/build.py --profile "$PROFILE" --target "$TARGET" \
            --subtarget "$SUBTARGET" --component "$COMPONENT" --output dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-extension-${{ inputs.component }}-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
          TARGET: ${{ inputs.target }}
          SUBTARGET: ${{ inputs.subtarget }}
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="${PROFILE%%/*}"
          tag="sdk-ext-${version}-${TARGET}-${SUBTARGET}-${COMPONENT}-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*.tar.gz dist/*.sha256 \
            --title "OpenWrt SDK extension: ${version} ${TARGET}/${SUBTARGET} ${COMPONENT}" \
            --notes "Prepared development component for an exact official OpenWrt SDK. Verify the included SDK SHA-256 before installation."
